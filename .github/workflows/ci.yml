# CI da web. A Vercel publica pela integração com o Git; o `next build` lá falha em erro de tipo, e este CI roda os
# testes antes do merge. As actions vão fixadas por SHA (tag é mutável: quem a mover roda código no nosso CI); o
# Dependabot propõe a troca.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tipos
      - run: pnpm lint
      - run: pnpm test
      - name: build
        env:
          CANTEIRO_DEMO: "1"
        run: pnpm build

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # os três idiomas da landing são gerados de template.html + i18n/*.json; HTML editado à mão se perde
      - name: landing gerada em dia
        run: python3 site/build.py --conferir

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t canteiro-web .
