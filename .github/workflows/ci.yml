# CI da web. A Vercel publica pela integração com o Git; o `next build` lá falha em erro de tipo, e este CI roda os
# testes antes do merge. As actions vão fixadas por SHA (tag é mutável: quem a mover roda código no nosso CI); o
# Dependabot propõe a troca.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
        env:
          CANTEIRO_DEMO: "1"

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: scripts/check-imagem.sh

  gate:
    if: always()
    needs: [web, imagem]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: scripts/check-gate.sh "$WEB" "$IMAGEM"
        env:
          WEB: ${{ needs.web.result }}
          IMAGEM: ${{ needs.imagem.result }}
