# Atualizações semanais. Minor e patch vêm num PR só por ecossistema (menos ruído); major vem sozinho, para ser lido.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # a imagem acompanha a versão maior do Node em que a Vercel roda o app em produção (24); trocar só aqui
      # testaria outra coisa
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
